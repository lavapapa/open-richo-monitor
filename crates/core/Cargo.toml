[package]
name = "ricoh-monitor-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
time = { version = "0.3", features = ["formatting"] }
httpdate = "1.0.3"
ring = "0.17"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "query", "rustls", "system-proxy", "socks"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Networking_WinHttp"] }
