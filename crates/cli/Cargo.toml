[package]
name = "ricoh-monitor-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ricoh-monitor"
path = "src/main.rs"

[dependencies]
ricoh-monitor-core = { path = "../core" }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["process"] }
