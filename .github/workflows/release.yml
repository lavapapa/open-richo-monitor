name: Build release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 构建平台（单平台仅生成工件）
        type: choice
        default: all
        options: [all, macos-15, macos-15-intel, windows-2022]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["macos-15","macos-15-intel","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        shell: bash
        run: |
          npm ci --prefix apps/notification-runtime
          npm ci --prefix apps/desktop
      - name: macOS tests and package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          npm test --prefix apps/notification-runtime
          npm run check --prefix apps/desktop
          npm test --prefix apps/desktop
          cargo test --locked --manifest-path crates/core/Cargo.toml
          npm run build:notifications --prefix apps/desktop
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo clean --profile dev --manifest-path crates/core/Cargo.toml
          cargo clean --profile dev --manifest-path apps/desktop/src-tauri/Cargo.toml
          df -h .
          npm run package:macos:dmg --prefix apps/desktop
          node scripts/test-notification-runtime.mjs apps/desktop/src-tauri/target/release/bundle/macos/open-richo-monitor.app/Contents/MacOS/notification-runtime apps/desktop/src-tauri/target/release/bundle/macos/open-richo-monitor.app/Contents/Resources/notification-runtime.mjs
      - name: Windows tests and package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/**/*.dmg
            dist/**/*.app.tar.gz
            dist/**/*.exe
            dist/**/*.sig
          if-no-files-found: error

  draft:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true
      - name: Prepare release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("apps/desktop/src-tauri/tauri.conf.json")).version')
          test "$GITHUB_REF" = "refs/tags/v$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null
          find dist/release -mindepth 2 -type f -exec cp {} dist/release/ \;
          node scripts/create-update-manifest.mjs dist/release
          gh release create "v$VERSION" $(find dist/release -maxdepth 1 -type f) --verify-tag --draft --title "open-richo-monitor $VERSION" --generate-notes
