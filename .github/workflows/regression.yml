name: Shared desktop regression
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'scripts/**'
      - 'third_party/**'
      - '.github/workflows/**'
      - 'LICENSE'
  push:
    branches: [main, 'codex/**']
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'scripts/**'
      - 'third_party/**'
      - '.github/workflows/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      platform:
        description: 原生回归平台
        type: choice
        default: all
        options: [all, macos-15, macos-15-intel, windows-2022]
permissions:
  contents: read
concurrency:
  group: regression-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["macos-15","macos-15-intel","windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      TAURI_CONFIG: '{"identifier":"dev.ricohmonitor.windowsqa","productName":"RichoMonitor Windows QA"}'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/notification-runtime/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> ../../../target
          cache-targets: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Shared tests and production runtime
        shell: bash
        run: |
          set -e
          npm ci --prefix apps/notification-runtime
          npm ci --prefix apps/desktop
          npm test --prefix apps/notification-runtime
          npm run check --prefix apps/desktop
          npm test --prefix apps/desktop -- --maxWorkers=2
          npm run build --prefix apps/desktop
          npm run build:notifications --prefix apps/desktop
          cargo test --locked --manifest-path crates/core/Cargo.toml -- --test-threads=2
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features tauri/custom-protocol --lib -- --test-threads=2
      - name: Production Windows runtime smoke
        if: runner.os == 'Windows'
        run: node scripts/test-notification-runtime.mjs apps/desktop/src-tauri/binaries/notification-runtime-x86_64-pc-windows-msvc.exe
      - name: Production macOS runtime smoke
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ARCH=$(node -p "process.arch === 'arm64' ? 'aarch64' : 'x86_64'")
          node scripts/test-notification-runtime.mjs "apps/desktop/src-tauri/binaries/notification-runtime-$ARCH-apple-darwin"
      - name: Build Windows QA app
        if: runner.os == 'Windows'
        run: cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features tauri/custom-protocol
      - name: Install official WebDriver tools
        if: runner.os == 'Windows'
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$env:USERPROFILE/.cargo/bin/msedgedriver-tool.exe"
      - name: Windows WebView and native commands
        if: runner.os == 'Windows'
        run: |
          $driver = Start-Process "$env:USERPROFILE/.cargo/bin/tauri-driver.exe" -ArgumentList "--native-driver", "$PWD/msedgedriver.exe" -PassThru
          try {
            node scripts/test-windows-desktop.mjs target/debug/ricoh-monitor-desktop.exe
            if ($LASTEXITCODE -ne 0) { throw 'Windows desktop verification failed' }
          } finally {
            if (-not $driver.HasExited) {
              $driver.Kill($true)
              $driver.WaitForExit()
            }
          }
      - uses: actions/upload-artifact@v6
        if: always() && runner.os == 'Windows'
        with:
          name: windows-desktop-verification
          path: dist/windows-verification/
          retention-days: 7
